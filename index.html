<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>龍とのドキドキ恋愛ゲーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}body{background:#dfe7ee;display:flex;justify-content:center}.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#dfe7ee;overflow:hidden}.header{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden}.avatar img,.mini img,.start-avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:700}.online{font-size:11px;color:#888;margin-top:2px}.status{background:#fff;padding:7px 12px;display:flex;gap:10px;align-items:center;font-size:12px;border-bottom:1px solid #ddd}.aff{font-weight:700;white-space:nowrap}.progress{height:5px;flex:1;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ff6b81;width:0;transition:.3s}.round{white-space:nowrap;color:#777}.chat{flex:1;overflow:auto;padding:14px 12px}.row{display:flex;gap:7px;align-items:flex-start;margin:10px 0}.ryu{justify-content:flex-start}.me{justify-content:flex-end}.mini{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none}.bubble{max-width:78%;padding:10px 13px;border-radius:17px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ryu .bubble{background:#fff;border-top-left-radius:5px;box-shadow:0 1px 2px #00000012}.me .bubble{background:#9fe3ff;border-top-right-radius:5px}.msgtime{font-size:10px;color:#6d7b86;margin-top:2px;white-space:nowrap}.ryu-stack{display:flex;flex-direction:column;max-width:78%}.ryu-stack .bubble{max-width:100%}.thought{display:inline-block;background:#edf0f3;color:#777;border-radius:12px;padding:7px 10px;font-size:13px;margin:9px 0}.typing{display:flex;gap:4px;background:#fff;padding:11px 13px;border-radius:17px;border-top-left-radius:5px}.typing i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:t .8s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes t{30%{transform:translateY(-3px)}}.choices{background:#fff;border-top:1px solid #ddd;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;min-height:170px;justify-content:center}.choice{position:relative;border:1px solid #d6dce1;background:#fff;border-radius:22px;padding:11px 42px 11px 15px;text-align:left;font-size:14px}.choice:after{content:"➤";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#8197ad}.choice:disabled{opacity:.38;cursor:default}.read-wrap{display:flex;justify-content:flex-end;margin:-7px 3px 7px 0}.read{font-size:10px;color:#6d7b86;opacity:0;transition:opacity .2s;white-space:pre-line;text-align:right}.read.show{opacity:1}.letter{display:none}.result{position:fixed;inset:0;display:none;background:#dfe7ee;z-index:10;flex-direction:column}.result.show{display:flex}.resulthead{background:#fff;text-align:center;padding:18px;font-weight:bold}.resultchat{flex:1;overflow:auto;padding:20px 12px}.resulttitle{text-align:center;font-size:28px;font-weight:800;margin:8px 0}.score{text-align:center;color:#777;margin-bottom:20px}
.ending-overlay{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .55s}
.ending-overlay.show{display:flex;opacity:1}.ending-card{width:min(390px,100%);background:#fff;border-radius:22px;padding:28px 20px;text-align:center;box-shadow:0 14px 45px #0004}
.ending-label{font-size:13px;color:#888;margin-bottom:7px}.ending-name{font-size:28px;font-weight:900;line-height:1.3}.ending-title-label{font-size:12px;color:#999;margin-top:24px}.ending-badge{display:inline-block;margin-top:7px;padding:9px 15px;border-radius:999px;background:#f1f3f5;font-size:17px;font-weight:800}.ending-score{margin-top:15px;color:#777;font-size:13px}.ending-next{margin-top:22px;border:0;border-radius:13px;background:#222;color:#fff;padding:12px 18px;font-weight:700;font-size:15px}
.blocked-notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:29;width:min(360px,calc(100% - 36px));background:#fff;border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 12px 40px #0004;display:none;font-weight:800;font-size:17px}.blocked-notice.show{display:block}.result-actions{display:flex;gap:9px;padding:10px 14px calc(16px + env(safe-area-inset-bottom));background:#dfe7ee}
.restart{flex:1;margin:0;border:0;border-radius:13px;background:#222;color:#fff;padding:13px 8px;font-weight:bold;font-size:14px}
.home-button{flex:1;border:1px solid #c9cfd5;border-radius:13px;background:#fff;color:#333;padding:13px 8px;font-weight:bold;font-size:14px}
.start-screen{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#fff 0%,#f8e2e8 100%);display:flex;align-items:center;justify-content:center;padding:24px}.start-card{width:min(420px,100%);text-align:center}.start-avatar{width:116px;height:116px;border-radius:50%;overflow:hidden;margin:0 auto 20px;border:4px solid #fff;box-shadow:0 5px 20px #0002}.start-title{font-size:29px;font-weight:900;line-height:1.35;margin:0 0 9px;color:#222}.start-sub{font-size:14px;color:#777;margin:0 0 27px}.name-input{width:100%;font-size:16px;padding:14px 15px;border:1px solid #d4d8dc;border-radius:13px;outline:none;background:#fff}.name-input:focus{border-color:#ff8296;box-shadow:0 0 0 3px #ff829626}.start-button{width:100%;margin-top:12px;border:0;border-radius:13px;background:#222;color:#fff;font-size:16px;font-weight:700;padding:14px}.start-button:disabled{opacity:.4}.start-note{font-size:12px;color:#999;margin-top:12px}

{opening:["〇〇さんは陸上は見ますか？"],choices:[["たまに見るかなー",10,["そうなんだ！僕も見るんだよねー","好きだから"]],["陸上は見ないかな",0,["そうなんですね。"]],["陸上は見てないけど龍くんのことはいつも見てるよ♥",-10,["そうなんだ。","キモイね"]]]},
{opening:["好きな映画とかなんかある？"],choices:[["恋愛映画とかよく見るよー",5,["いいねぇ","そういう子好きよ"]],["リメンバー・ミー",16,["俺も好き！！","俺たち気が合うかもね","もうファミリー"]],["スタンド・バイ・ミー",-12,["何そのクソ映画","B級映画の話？"]]]},
{opening:["最近何しました？"],choices:[["(無視)",-3,["無視とかありえない","親がそういう人なんだろうね","非常識","人間？","おばあちゃん世代？"]],["サッカー観戦しました！",-2,["サッカーつまんなくね？","野球の方が面白いだろ","大谷サイコー👊"]],["勉強してたけどサボっちゃった笑",9,["俺も勉強してたけどブロスタしちゃった笑","友達にキューブ渡すために何回も自滅する作戦してたけどあれなんだったんだろ"]]]},
{thought:"(何か送ってみよっかな)",choices:[["小樽のオルゴール館行ったことある？",8,["行ったことあるけど世界一面白かった","最高すぎ"]],["体育館横のトイレに入って行ったけど何してたの？",-9,["パンツ隠してたけど誰かに取られちゃいました😊","これ秘密ね"]],["そういえば紅白出てた？",2,["BE:FIRSTのリュウヘイじゃねぇわ","もう似てないし"]]]},
{thought:"何か送ってみよっかな",choices:[["好きな人のタイプは？",-6,["んなもん聞くな"]],["龍くんってかっこいいよね",-8,["なわけないだろ","この顔だぞ"]],["待機の王様、タイキング",8,["おもしろ","それギャグもらうね"]]]},
{opening:["ちょっと最近した失敗聞いて欲しい","お菓子のパイの実を電子レンジで温めたら煙出て焦げた"],choices:[["わろた",4,["結構やばかったわ"]],["非常識すぎるやろ",6,["ちょっとやってみたかったんだよ","ゆるして🤣"]],["大丈夫だったの？",-3,["笑えよ","エピソードトークしてんだよ","惨めだろ","あなた顔面氷結女？"]]]},
{opening:["あのさー","聞きたいことあるけど","無能←これなんて読みます？"],choices:[["むのう",2,["なるほど","ありがとう"]],["すずきたつ",-10,["調子乗ってる？","俺の親結構有名な人で色んな人と繋がりあるけど大丈夫？","笑"]],["わかんない",-2,["聞いて損でした","労力返して欲しい","お前は調べろよ"]]]},
{opening:["明日って何曜日だっけ？"],choices:[["土曜日だよ！",0,["しってるわ","ボケろし","チャンスだったのにね"]],["水曜日だよ！(嘘)",-7,["なるほど水曜日ね、、、","なわけあるかーーーい笑","適当なこと言うなーーー！！笑","ってふざけんなよ"]],["プップー🚗💨",12,["なるほどね","逆にね"]]]},
{opening:["あのさ","ザザシティの上の階にちょうどいいスペースあるの知ってる？"],choices:[["知らない",-3,["知らないのがかっこいいと思ってる？","無知は恥だからね"]],["知ってるよ！",4,["あそこいいよなー","たまに変な人いるけど結構便利","俺ほぼ毎日使ってるわ笑"]],["毎日使ってるよ！",-5,["嘘つけ","俺は本当に毎日使ってるけどお前見たことないぞ","正直者になれよ","親悲しむぞ","反省しろ"]]]}
];
const endings=[
{max:30,type:"block",title:"💔 ブロックエンド",badge:"龍に嫌われた惨めな人",msgs:["あのさ","俺お前嫌いだわ","先生にも言って注意してもらう","お前ブロックな"]},
{max:69,type:"friend",title:"🙂 友達エンド",badge:"これからもよろしく！",msgs:["少し喋りすぎたわ","また今度な"]},
{max:Infinity,type:"love",title:"💕 付き合いエンド",badge:"恋愛マスター",msgs:["あのさ","ちょっと急で申し訳ないんだけどさ","俺たち付き合わね？","😘"]}
];
let score=0,round=1,current=null,scenarios=[],locked=false,playerName="";
const $=id=>document.getElementById(id);const wait=ms=>new Promise(r=>setTimeout(r,ms));const nowTime=()=>new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});const personalize=s=>s.replaceAll("〇〇",playerName);const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function avatar(){return `<div class="mini"><img src="${RYU_AVATAR}" alt=""></div>`}function bubble(t,who="ryu",target="chat"){let r=document.createElement("div");r.className="row "+who;if(who==="ryu"){r.innerHTML=avatar()+`<div class="ryu-stack"><div class="bubble">${esc(t)}</div><div class="msgtime">${nowTime()}</div></div>`}else{r.innerHTML=`<div class="bubble">${esc(t)}</div>`}$(target).appendChild(r);if(who==="ryu")playMessageSound();return r}
function addRead(){let w=document.createElement("div");w.className="read-wrap";let tm=nowTime();w.innerHTML='<span class="read"></span>';$("chat").appendChild(w);scrollChat();setTimeout(()=>{let s=w.querySelector(".read");if(s){s.textContent="既読\n"+tm;s.classList.add("show")}},500)}
function thought(t){let d=document.createElement("div");d.className="thought";d.textContent=t;$("chat").appendChild(d)}
function scrollChat(){$("chat").scrollTop=$("chat").scrollHeight}
function update(){$("score").textContent=score;$("bar").style.width=Math.max(0,Math.min(100,score))+"%";$("round").textContent=round}
function typing(){let r=document.createElement("div");r.className="row ryu";r.innerHTML=avatar()+`<div class="typing"><i></i><i></i><i></i></div>`;$("chat").appendChild(r);scrollChat();return r}
async function ryuMessages(msgs,delay=900,gap=1050){if(delay)await wait(delay);for(let i=0;i<msgs.length;i++){let t=typing();await wait(1100);t.remove();bubble(personalize(msgs[i]));scrollChat();if(i<msgs.length-1)await wait(gap)}}
async function show(){locked=true;if(current.thought)thought(personalize(current.thought));if(current.opening)await ryuMessages(current.opening,round===1?700:2600);$("choices").innerHTML="";current.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<span class="letter">${"ABC"[i]}</span>${esc(personalize(c[0]))}`;b.onclick=()=>choose(i);$("choices").appendChild(b)});locked=false;scrollChat()}
async function choose(i){if(locked)return;locked=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);let c=current.choices[i];bubble(personalize(c[0]),"me");addRead();score+=c[1];update();scrollChat();await wait(1000);let t=typing();await wait(1300);t.remove();for(let j=0;j<c[2].length;j++){bubble(personalize(c[2][j]));scrollChat();if(j<c[2].length-1)await wait(1100)}if(round===10){await wait(2800);end();return}await wait(2800);round++;current=scenarios[round-2];update();show()}
async function end(){
  locked=true;
  let e=endings.find(x=>score<=x.max);
  await wait(900);
  for(let i=0;i<e.msgs.length;i++){
    let pause=1050;
    if(e.type==="love" && i===1)pause=1900;
    if(e.type==="love" && i===2)pause=2300;
    if(e.type==="block" && i===3)pause=1700;
    await wait(pause);
    let t=typing();
    await wait(1050);
    t.remove();
    bubble(e.msgs[i]);
    scrollChat();
  }
  if(e.type==="block"){
    await wait(1700);
    $("blockedNotice").classList.add("show");
    await wait(1900);
    $("blockedNotice").classList.remove("show");
  }else{
    await wait(e.type==="love"?2200:1500);
  }
  showEndingCard(e);
}
function showEndingCard(e){
  $("endingName").textContent=e.title;
  $("endingBadge").textContent=e.badge;
  $("endingScore").textContent="最終好感度："+score;
  $("endingOverlay").classList.add("show");
}
function showResult(){
  let e=endings.find(x=>score<=x.max),box=$("resultchat");
  $("endingOverlay").classList.remove("show");
  box.innerHTML=`<div class="resulttitle">${e.title}</div><div class="score">称号：${e.badge}<br>最終好感度：${score}</div>`;
  $("result").classList.add("show");
  box.scrollTop=0;
}
function start(){score=0;round=1;locked=false;scenarios=shuffle(pool);$("result").classList.remove("show");$("chat").innerHTML="";update();current=fixed;show()}
function beginGame(){let n=$("playerName").value.trim();if(!n)return;playerName=n;try{messageAudio.volume=0;messageAudio.play().then(()=>{messageAudio.pause();messageAudio.currentTime=0;messageAudio.volume=1}).catch(()=>{messageAudio.volume=1})}catch(e){}$("startScreen").style.display="none";start()}
$("playerName").addEventListener("input",()=>{$("startButton").disabled=!$("playerName").value.trim()});$("playerName").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("playerName").value.trim())beginGame()});$("startButton").addEventListener("click",beginGame);
$("endingNext").addEventListener("click",showResult);
$("restart").addEventListener("click",()=>{
  $("endingOverlay").classList.remove("show");
  $("blockedNotice").classList.remove("show");
  $("result").classList.remove("show");
  start();
});
$("backToStart").addEventListener("click",()=>{
  $("endingOverlay").classList.remove("show");
  $("blockedNotice").classList.remove("show");
  $("result").classList.remove("show");
  $("chat").innerHTML="";
  $("choices").innerHTML="";
  score=0;round=1;locked=false;
  update();
  $("playerName").value=playerName;
  $("startButton").disabled=!$("playerName").value.trim();
  $("startScreen").style.display="flex";
});
update();
</script></body></html>
