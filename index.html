const endings=[
{max:30,type:"block",title:"💔 ブロックエンド",badge:"龍に嫌われた惨めな人",msgs:["あのさ","俺お前嫌いだわ","先生にも言って注意してもらう","お前ブロックな"]},
{max:69,type:"friend",title:"🙂 友達エンド",badge:"これからもよろしく！",msgs:["少し喋りすぎたわ","また今度な"]},
{max:Infinity,type:"love",title:"💕 付き合いエンド",badge:"恋愛マスター",msgs:["あのさ","ちょっと急で申し訳ないんだけどさ","俺たち付き合わね？","😘"]}
];
let score=0,round=1,current=null,scenarios=[],locked=false,playerName="";
const $=id=>document.getElementById(id);const wait=ms=>new Promise(r=>setTimeout(r,ms));const nowTime=()=>new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});const personalize=s=>s.replaceAll("〇〇",playerName);const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function avatar(){return `<div class="mini"><img src="${RYU_AVATAR}" alt=""></div>`}function bubble(t,who="ryu",target="chat"){
  let r=document.createElement("div");
  r.className="row "+who;
  if(who==="ryu"){
    r.innerHTML=avatar()+`<div class="ryu-stack"><div class="bubble">${esc(t)}</div><div class="msgtime">${nowTime()}</div></div>`;
  }else{
    let tm=nowTime();
    r.innerHTML=`<div class="me-meta" data-time="${tm}">${tm}</div><div class="bubble">${esc(t)}</div>`;
  }
  $(target).appendChild(r);
  if(who==="ryu")playMessageSound();
  return r;
}
function addRead(){
  let rows=$("chat").querySelectorAll(".row.me");
  let row=rows[rows.length-1];
  if(!row)return;
  let meta=row.querySelector(".me-meta");
  if(!meta)return;
  let tm=meta.dataset.time||nowTime();
  meta.textContent=tm;
  setTimeout(()=>{
    meta.textContent="既読\n"+tm;
    meta.classList.add("show");
  },500);
}
function imageBubble(src){let r=document.createElement("div");r.className="row ryu";r.innerHTML=avatar()+`<div class="photo-stack"><div class="photo-bubble"><img src="${src}" alt="龍から送られた写真"></div><div class="msgtime">${nowTime()}</div></div>`;$("chat").appendChild(r);playMessageSound();scrollChat();return r;}
function thought(t){let d=document.createElement("div");d.className="thought";d.textContent=t;$("chat").appendChild(d)}
function scrollChat(){$("chat").scrollTop=$("chat").scrollHeight}
function update(){$("score").textContent=score;$("bar").style.width=Math.max(0,Math.min(100,score))+"%";$("round").textContent=round}
function typing(){let r=document.createElement("div");r.className="row ryu";r.innerHTML=avatar()+`<div class="typing"><i></i><i></i><i></i></div>`;$("chat").appendChild(r);scrollChat();return r}
async function ryuMessages(msgs,delay=900,gap=1050){if(delay)await wait(delay);for(let i=0;i<msgs.length;i++){let t=typing();await wait(1100);t.remove();bubble(personalize(msgs[i]));scrollChat();if(i<msgs.length-1)await wait(gap)}}
async function show(){locked=true;if(current.thought)thought(personalize(current.thought));if(current.openingImage){await wait(round===1?700:2600);let t=typing();await wait(1100);t.remove();imageBubble(current.openingImage);await wait(1050)}if(current.opening)await ryuMessages(current.opening,current.openingImage?0:(round===1?700:2600));$("choices").innerHTML="";current.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<span class="letter">${"ABC"[i]}</span>${esc(personalize(c[0]))}`;b.onclick=()=>choose(i);$("choices").appendChild(b)});locked=false;scrollChat()}
async function choose(i){if(locked)return;locked=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);let c=current.choices[i];bubble(personalize(c[0]),"me");addRead();score+=c[1];update();scrollChat();await wait(1000);let t=typing();await wait(1300);t.remove();for(let j=0;j<c[2].length;j++){bubble(personalize(c[2][j]));scrollChat();if(j<c[2].length-1)await wait(1100)}if(round===10){await wait(2800);end();return}await wait(2800);round++;current=scenarios[round-2];update();show()}
async function end(){
  locked=true;
  let e=endings.find(x=>score<=x.max);
  await wait(900);
  for(let i=0;i<e.msgs.length;i++){
    let pause=1050;
    if(e.type==="love" && i===1)pause=1900;
    if(e.type==="love" && i===2)pause=2300;
    if(e.type==="block" && i===3)pause=1700;
    await wait(pause);
    let t=typing();
    await wait(1050);
    t.remove();
    bubble(e.msgs[i]);
    scrollChat();
  }
  if(e.type==="block"){
    await wait(1700);
    $("blockedNotice").classList.add("show");
    await wait(1900);
    $("blockedNotice").classList.remove("show");
  }else{
    await wait(e.type==="love"?2200:1500);
  }
  showEndingCard(e);
}
function showEndingCard(e){
  $("endingName").textContent=e.title;
  $("endingBadge").textContent=e.badge;
  $("endingScore").textContent="最終好感度："+score;
  $("endingOverlay").classList.add("show");
}
function showResult(){
  let e=endings.find(x=>score<=x.max),box=$("resultchat");
  $("endingOverlay").classList.remove("show");
  box.innerHTML=`<div class="resulttitle">${e.title}</div><div class="score">称号：${e.badge}<br>最終好感度：${score}</div>`;
  $("result").classList.add("show");
  box.scrollTop=0;
}
function start(){score=0;round=1;locked=false;scenarios=shuffle(pool);$("result").classList.remove("show");$("chat").innerHTML="";update();current=fixed;show()}
function beginGame(){let n=$("playerName").value.trim();if(!n)return;playerName=n;try{messageAudio.volume=0;messageAudio.play().then(()=>{messageAudio.pause();messageAudio.currentTime=0;messageAudio.volume=1}).catch(()=>{messageAudio.volume=1})}catch(e){}$("startScreen").style.display="none";start()}
$("playerName").addEventListener("input",()=>{$("startButton").disabled=!$("playerName").value.trim()});$("playerName").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("playerName").value.trim())beginGame()});$("startButton").addEventListener("click",beginGame);
$("endingNext").addEventListener("click",showResult);
$("restart").addEventListener("click",()=>{
  $("endingOverlay").classList.remove("show");
  $("blockedNotice").classList.remove("show");
  $("result").classList.remove("show");
  start();
});
$("backToStart").addEventListener("click",()=>{
  $("endingOverlay").classList.remove("show");
  $("blockedNotice").classList.remove("show");
  $("result").classList.remove("show");
  $("chat").innerHTML="";
  $("choices").innerHTML="";
  score=0;round=1;locked=false;
  update();
  $("playerName").value=playerName;
  $("startButton").disabled=!$("playerName").value.trim();
  $("startScreen").style.display="flex";
});
update();
</script></body></html>
