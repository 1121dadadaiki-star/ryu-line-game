<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>龍とのLINE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{background:#dfe7ee;display:flex;justify-content:center}.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#dfe7ee;overflow:hidden}
.header{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}.avatar{width:42px;height:42px;border-radius:50%;background:#333;color:#fff;display:grid;place-items:center;overflow:hidden;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700}.online{font-size:11px;color:#888;margin-top:2px}.status{background:#fff;padding:7px 12px;display:flex;gap:10px;align-items:center;font-size:12px;border-bottom:1px solid #ddd}.aff{font-weight:700;white-space:nowrap}.progress{height:5px;flex:1;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ff6b81;width:0;transition:.3s}.round{white-space:nowrap;color:#777}
.chat{flex:1;overflow:auto;padding:12px}.row{display:flex;gap:6px;align-items:flex-end;margin:7px 0}.ryu{justify-content:flex-start}.me{justify-content:flex-end}.mini{width:31px;height:31px;border-radius:50%;background:#333;color:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font-size:12px;font-weight:bold}.mini img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:78%;padding:8px 11px;border-radius:15px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ryu .bubble{background:#fff;border-top-left-radius:5px}.me .bubble{background:#9fe3ff;border-top-right-radius:5px}.thought{display:inline-block;background:#edf0f3;color:#777;border-radius:12px;padding:6px 10px;font-size:13px;margin:7px 0}
.typing{display:flex;gap:4px;background:#fff;padding:9px 12px;border-radius:15px;border-top-left-radius:5px}.typing i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:t .8s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes t{30%{transform:translateY(-3px)}}
.choices{background:#fff;border-top:1px solid #ddd;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}.choice{border:1px solid #d6dce1;background:#f8fafb;border-radius:12px;padding:10px;text-align:left;cursor:pointer}.choice:active{transform:scale(.985)}.letter{display:inline-grid;place-items:center;width:22px;height:22px;background:#333;color:#fff;border-radius:50%;font-size:11px;margin-right:7px}
.result{position:fixed;inset:0;display:none;background:#dfe7ee;z-index:10;flex-direction:column}.result.show{display:flex}.resulthead{background:#fff;text-align:center;padding:18px;font-weight:bold}.resultchat{flex:1;overflow:auto;padding:20px 12px}.resulttitle{text-align:center;font-size:28px;font-weight:800;margin:8px 0}.score{text-align:center;color:#777;margin-bottom:20px}.restart{margin:10px 14px calc(16px + env(safe-area-inset-bottom));border:0;border-radius:13px;background:#222;color:#fff;padding:13px;font-weight:bold}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="avatar"><img id="headImg" style="display:none"><span id="headText">龍</span></div><div><div class="name">鈴木 龍</div><div class="online">オンライン</div></div></header>
<div class="status"><span class="aff">❤️ 好感度 <b id="score">0</b></span><div class="progress"><div id="bar" class="bar"></div></div><span class="round">ラリー <b id="round">1</b>/10</span></div>
<main id="chat" class="chat"></main><div id="choices" class="choices"></div>
<section id="result" class="result"><div class="resulthead">ゲーム終了</div><div id="resultchat" class="resultchat"></div><button class="restart" onclick="start()">もう一度遊ぶ</button></section>
</div>
<script>
/* 龍の写真を設定する場合：
   例）const RYU_AVATAR = "ryu.jpg";
   同じフォルダに画像を置けば使えます。 */
const RYU_AVATAR="";

const fixed={
 opening:["すみません。教科書貸してくれませんか。"],
 choices:[
  ["いいよー",3,["ありがとうございます","優しいですね"]],
  ["はい？",-2,["嫌なら別にいいですよ。こっちから願い下げです"]],
  ["(無視)",-10,["は？","何無視してんの？","返事しろよカスが"]]
 ]};

const pool=[
 {opening:["〇〇さんは陸上は見ますか？"],choices:[
  ["たまに見るかなー",10,["そうなんだ！僕も見るんだよねー","好きだから"]],
  ["陸上は見ないかな",0,["そうなんですね。"]],
  ["陸上は見てないけど龍くんのことはいつも見てるよ♥",-10,["そうなんだ。","キモイね"]]]},
 {opening:["好きな映画とかなんかある？"],choices:[
  ["恋愛映画とかよく見るよー",5,["いいねぇ","そういう子好きよ"]],
  ["リメンバー・ミー",16,["俺も好き！！","俺たち気が合うかもね","もうファミリー"]],
  ["スタンド・バイ・ミー",-12,["何そのクソ映画","B級映画の話？"]]]},
 {opening:["最近何しました？"],choices:[
  ["(無視)",-3,["無視とかありえない","親がそういう人なんだろうね","非常識","人間？","おばあちゃん世代？"]],
  ["サッカー観戦しました！",-2,["サッカーつまんなくね？","野球の方が面白いだろ","大谷サイコー👊"]],
  ["勉強してたけどサボっちゃった笑",9,["俺も勉強してたけどブロスタしちゃった笑","友達にキューブ渡すために何回も自滅する作戦してたけどあれなんだったんだろ"]]]},
 {thought:"(何か送ってみよっかな)",choices:[
  ["小樽のオルゴール館行ったことある？",8,["行ったことあるけど世界一面白かった","最高すぎ"]],
  ["体育館横のトイレに入って行ったけど何してたの？",-9,["パンツ隠してたけど誰かに取られちゃいました😊","これ秘密ね"]],
  ["そういえば紅白出てた？",2,["BE:FIRSTのリュウヘイじゃねぇわ","もう似てないし"]]]},
 {thought:"何か送ってみよっかな",choices:[
  ["好きな人のタイプは？",-6,["んなもん聞くな"]],
  ["龍くんってかっこいいよね",-8,["なわけないだろ","この顔だぞ"]],
  ["待機の王様、タイキング",8,["おもしろ","それギャグもらうね"]]]},
 {opening:["ちょっと最近した失敗聞いて欲しい","お菓子のパイの実を電子レンジで温めたら煙出て焦げた"],choices:[
  ["わろた",4,["結構やばかったわ"]],
  ["非常識すぎるやろ",6,["ちょっとやってみたかったんだよ","ゆるして🤣"]],
  ["大丈夫だったの？",-3,["笑えよ","エピソードトークしてんだよ","惨めだろ","あなた顔面氷結女？"]]]},
 {opening:["あのさー","聞きたいことあるけど","無能←これなんて読みます？"],choices:[
  ["むのう",2,["なるほど","ありがとう"]],
  ["すずきたつ",-10,["調子乗ってる？","俺の親結構有名な人で色んな人と繋がりあるけど大丈夫？","笑"]],
  ["わかんない",-2,["聞いて損でした","労力返して欲しい","お前は調べろよ"]]]},
 {opening:["明日って何曜日だっけ？"],choices:[
  ["土曜日だよ！",0,["しってるわ","ボケろし","チャンスだったのにね"]],
  ["水曜日だよ！(嘘)",-7,["なるほど水曜日ね、、、","なわけあるかーーーい笑","適当なこと言うなーーー！！笑","ってふざけんなよ"]],
  ["プップー🚗💨",12,["なるほどね","逆にね"]]]},
 {opening:["あのさ","ザザシティの上の階にちょうどいいスペースあるの知ってる？"],choices:[
  ["知らない",-3,["知らないのがかっこいいと思ってる？","無知は恥だからね"]],
  ["知ってるよ！",4,["あそこいいよなー","たまに変な人いるけど結構便利","俺ほぼ毎日使ってるわ笑"]],
  ["毎日使ってるよ！",-5,["嘘つけ","俺は本当に毎日使ってるけどお前見たことないぞ","正直者になれよ","親悲しむぞ","反省しろ"]]]}
];

const endings=[
 {max:30,title:"💔 ブロックエンド",msgs:["あのさ","俺お前嫌いだわ","先生にも言って注意してもらう","お前ブロックな"]},
 {max:69,title:"🙂 友達エンド",msgs:["少し喋りすぎたわ","また今度な"]},
 {max:Infinity,title:"💕 付き合いエンド",msgs:["あのさ","ちょっと急で申し訳ないんだけどさ","俺たち付き合わね？","😘"]}
];

let score=0,round=1,current=null,scenarios=[],locked=false;
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function avatar(cls="mini"){return `<div class="${cls}">${RYU_AVATAR?`<img src="${RYU_AVATAR}">`:"龍"}</div>`}
function bubble(t,who="ryu"){let r=document.createElement("div");r.className="row "+who;r.innerHTML=who==="ryu"?avatar()+`<div class="bubble">${esc(t)}</div>`:`<div class="bubble">${esc(t)}</div>`;$("chat").appendChild(r)}
function thought(t){let d=document.createElement("div");d.className="thought";d.textContent=t;$("chat").appendChild(d)}
function scroll(){ $("chat").scrollTop=$("chat").scrollHeight }
function update(){ $("score").textContent=score;$("bar").style.width=Math.max(0,Math.min(100,score))+"%";$("round").textContent=round}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function show(){if(current.thought)thought(current.thought);if(current.opening)current.opening.forEach(bubble);let box=$("choices");box.innerHTML="";current.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<span class="letter">${"ABC"[i]}</span>${esc(c[0])}`;b.onclick=()=>choose(i);box.appendChild(b)});scroll()}
function choose(i){if(locked)return;locked=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);let c=current.choices[i];bubble(c[0],"me");score+=c[1];update();scroll();setTimeout(()=>{let r=document.createElement("div");r.id="typing";r.className="row ryu";r.innerHTML=avatar()+`<div class="typing"><i></i><i></i><i></i></div>`;$("chat").appendChild(r);scroll();setTimeout(()=>{r.remove();c[2].forEach(bubble);scroll();setTimeout(next,450)},650)},250)}
function next(){if(round===10){end();return}round++;current=scenarios[round-2];locked=false;update();setTimeout(show,180)}
function end(){ $("choices").innerHTML="";let e=endings.find(x=>score<=x.max);let box=$("resultchat");box.innerHTML=`<div class="resulttitle">${e.title}</div><div class="score">最終好感度：${score}</div>`;e.msgs.forEach(t=>{let r=document.createElement("div");r.className="row ryu";r.innerHTML=avatar()+`<div class="bubble">${esc(t)}</div>`;box.appendChild(r)});$("result").classList.add("show");box.scrollTop=0}
function start(){score=0;round=1;locked=false;scenarios=shuffle(pool);$("result").classList.remove("show");$("chat").innerHTML="";update();if(RYU_AVATAR){$("headImg").src=RYU_AVATAR;$("headImg").style.display="block";$("headText").style.display="none"}current=fixed;show()}
start();
</script>
</body>
</html>
